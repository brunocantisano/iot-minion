name: Build Arduino

on:
  workflow_dispatch:
    branches: [ ESP8266 ]
    inputs:
      name:
        description: 'Iniciar a geração de firmware para arduino'
        default: 'Iniciar'
        required: true

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    env:
      APP_NAME:          iot-minion
      VERSION:           1.0.${{ github.run_number }}
      PIO_ENV:           nodemcuv2

    steps:
      # ── Código ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python + PlatformIO ───────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install platformio

      # ── Injeta segredos no Credentials.h ─────────────────────────────────
      - name: Inject secrets into Credentials.h
        env:
          API_MINION_TOKEN: ${{ secrets.API_MINION_TOKEN }}
          USER_FIRMWARE:    ${{ secrets.USER_FIRMWARE }}
          PASS_FIRMWARE:    ${{ secrets.PASS_FIRMWARE }}
          AIO_USERNAME:     ${{ secrets.AIO_USERNAME }}
          AIO_KEY:          ${{ secrets.AIO_KEY }}
        run: |
          CRED="arduino/${{ env.APP_NAME }}/Credentials.h"
          sed -i "s|<USER_FIRMWARE>|${USER_FIRMWARE}|g"     "$CRED"
          sed -i "s|<PASS_FIRMWARE>|${PASS_FIRMWARE}|g"     "$CRED"
          sed -i "s|<AIO_USERNAME>|${AIO_USERNAME}|g"       "$CRED"
          sed -i "s|<AIO_KEY>|${AIO_KEY}|g"                 "$CRED"
          sed -i "s|<API_MINION_TOKEN>|${API_MINION_TOKEN}|g" "$CRED"
          sed -i "s|<API_VERSION>|${{ env.VERSION }}|g"     "$CRED"

      # ── Build firmware (.bin) ─────────────────────────────────────────────
      - name: Build firmware
        run: |
          platformio run \
            --environment ${{ env.PIO_ENV }} \
            --project-dir arduino/${{ env.APP_NAME }}

      # ── Build filesystem LittleFS (.bin) ──────────────────────────────────
      - name: Build filesystem image
        run: |
          platformio run \
            --target buildfs \
            --environment ${{ env.PIO_ENV }} \
            --project-dir arduino/${{ env.APP_NAME }}

      # ── Renomeia os binários com versão ───────────────────────────────────
      - name: Rename binaries
        run: |
          BUILD_DIR="arduino/${{ env.APP_NAME }}/.pio/build/${{ env.PIO_ENV }}"
          cp "${BUILD_DIR}/firmware.bin"  "${{ env.APP_NAME }}-v${{ env.VERSION }}.bin"
          cp "${BUILD_DIR}/littlefs.bin"  "${{ env.APP_NAME }}-v${{ env.VERSION }}-fs.bin"

      # ── Empacota os dois binários em .gz ──────────────────────────────────
      - name: Package binaries
        run: |
          tar -czvf \
            "${{ env.APP_NAME }}-v${{ env.VERSION }}.tar.gz" \
            "${{ env.APP_NAME }}-v${{ env.VERSION }}.bin" \
            "${{ env.APP_NAME }}-v${{ env.VERSION }}-fs.bin"

      # ── Cria a release no GitHub ──────────────────────────────────────────
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name:     v${{ env.VERSION }}
          release_name: minion-esp8266-v${{ env.VERSION }}
          draft:        false
          prerelease:   false

      # ── Upload do pacote na release ───────────────────────────────────────
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url:        ${{ steps.create_release.outputs.upload_url }}
          asset_path:        ${{ env.APP_NAME }}-v${{ env.VERSION }}.tar.gz
          asset_name:        ${{ env.APP_NAME }}-v${{ env.VERSION }}.tar.gz
          asset_content_type: application/gzip
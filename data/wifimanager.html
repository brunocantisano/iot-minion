<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Wi-Fi</title><style>:root{--bg:#0f172a;--card:#1e293b;--card-border:#334155;--accent:#38bdf8;--accent-hover:#0ea5e9;--text:#e2e8f0;--muted:#94a3b8;--input-bg:#0f172a;--ok:#22c55e}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#1e293b 0,var(--bg) 60%);color:var(--text);padding:24px}.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.45)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}.brand .icon{width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,var(--accent),#6366f1)}.brand .icon svg{width:24px;height:24px}h1{font-size:20px;margin:0;font-weight:600}.sub{color:var(--muted);font-size:13px;margin:4px 0 24px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field{margin-bottom:18px}.input-wrap{position:relative}input{width:100%;padding:13px 14px;font-size:15px;color:var(--text);background:var(--input-bg);border:1px solid var(--card-border);border-radius:10px;outline:0;transition:border-color .15s,box-shadow .15s}input::placeholder{color:#64748b}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.18)}.toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:0 0;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:4px 6px}button.submit{width:100%;padding:14px;font-size:15px;font-weight:600;color:#06283d;cursor:pointer;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-hover));transition:transform .05s,filter .15s;margin-top:6px}button.submit:hover{filter:brightness(1.05)}button.submit:active{transform:translateY(1px)}.foot{display:flex;align-items:center;gap:8px;margin-top:20px;color:var(--muted);font-size:12px;justify-content:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}</style></head><body><div class="card"><div class="brand"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg></div><div><h1>Configurar Wi-Fi</h1><div class="sub" style="margin:0">Conecte sua placa à rede</div></div></div><form method="POST" action="/save" style="margin-top:8px"><div class="field"><label for="ssid">Nome da rede (SSID)</label><div class="input-wrap"><input id="ssid" name="ssid" placeholder="MinhaRedeWiFi" autocomplete="off" required></div></div><div class="field"><label for="pass">Senha</label><div class="input-wrap"><input id="pass" name="pass" type="password" required><button type="button" class="toggle" onclick='var p=document.getElementById("pass"),s="password"===p.type;p.type=s?"text":"password",this.textContent=s?"Ocultar":"Mostrar"'>Mostrar</button></div></div><div class="field"><label for="user_firmware">Usuário do firmware (OTA)</label><div class="input-wrap"><input id="user_firmware" name="user_firmware" autocomplete="off" required></div></div><div class="field"><label for="pass_firmware">Senha do firmware (OTA)</label><div class="input-wrap"><input id="pass_firmware" name="pass_firmware" type="password" required><button type="button" class="toggle" onclick='var p=document.getElementById("pass_firmware"),s="password"===p.type;p.type=s?"text":"password",this.textContent=s?"Ocultar":"Mostrar"'>Mostrar</button></div></div><div class="field"><label for="api_user">Usuário da API</label><div class="input-wrap"><input id="api_user" name="api_user" autocomplete="off" required></div></div><div class="field"><label for="api_pass">Senha da API</label><div class="input-wrap"><input id="api_pass" name="api_pass" type="password" required><button type="button" class="toggle" onclick='var p=document.getElementById("api_pass"),s="password"===p.type;p.type=s?"text":"password",this.textContent=s?"Ocultar":"Mostrar"'>Mostrar</button></div></div><div class="field"><label for="openai_key">Chave da API OpenAI (OPEN_IA_KEY)</label><div class="input-wrap"><input id="openai_key" name="openai_key" type="password" autocomplete="off" required><button type="button" class="toggle" onclick='var p=document.getElementById("openai_key"),s="password"===p.type;p.type=s?"text":"password",this.textContent=s?"Ocultar":"Mostrar"'>Mostrar</button></div></div><div class="field"><label for="caller_origin">Caller Origin (CORS) - * significa qualquer origem</label><div class="input-wrap"><input id="caller_origin" name="caller_origin" value="*" placeholder="* em APIs gera risco de segurança!" autocomplete="off" required></div></div><div class="field"><label for="mqtt_broker">MQTT Broker</label><div class="input-wrap"><input id="mqtt_broker" name="mqtt_broker" autocomplete="off" value="io.adafruit.com" required></div></div><div class="field"><label for="mqtt_port">MQTT Porta</label><div class="input-wrap"><input id="mqtt_port" name="mqtt_port" type="number" autocomplete="off" value="1883" required></div></div><div class="field"><label for="mqtt_username">MQTT Usuário</label><div class="input-wrap"><input id="mqtt_username" name="mqtt_username" autocomplete="off" required></div></div><div class="field"><label for="mqtt_password">MQTT Senha</label><div class="input-wrap"><input id="mqtt_password" name="mqtt_password" type="password" required><button type="button" class="toggle" onclick='var p=document.getElementById("mqtt_password"),s="password"===p.type;p.type=s?"text":"password",this.textContent=s?"Ocultar":"Mostrar"'>Mostrar</button></div></div><div class="field"><label for="smtp_host">SMTP Host</label><div class="input-wrap"><input id="smtp_host" name="smtp_host" autocomplete="off" required></div></div><div class="field"><label for="smtp_port">SMTP Porta</label><div class="input-wrap"><input id="smtp_port" name="smtp_port" type="number" list="smtp_port_options" autocomplete="off" placeholder="587" required><datalist id="smtp_port_options"><option value="25" label="25 - SMTP (sem criptografia)"><option value="465" label="465 - SMTPS (SSL)"><option value="587" label="587 - SMTP (STARTTLS)"><option value="2525" label="2525 - SMTP alternativo"></datalist></div></div><div class="field"><label for="smtp_author_email">E-mail do remetente</label><div class="input-wrap"><input id="smtp_author_email" name="smtp_author_email" type="email" autocomplete="off" required></div></div><div class="field"><label for="author_password">Senha do e-mail (remetente)</label><div class="input-wrap"><input id="author_password" name="author_password" type="password" required><button type="button" class="toggle" onclick='var p=document.getElementById("author_password"),s="password"===p.type;p.type=s?"text":"password",this.textContent=s?"Ocultar":"Mostrar"'>Mostrar</button></div></div><div class="field"><label for="recipient_email">E-mail do destinatário</label><div class="input-wrap"><input id="recipient_email" name="recipient_email" type="email" autocomplete="off" required></div></div><div class="field"><label for="recipient_name">Nome do destinatário</label><div class="input-wrap"><input id="recipient_name" name="recipient_name" autocomplete="off" required></div></div><button class="submit"type="submit">Salvar e reiniciar</button></form><div class="foot"><span class="dot"></span><span>Ponto de acesso ativo</span></div></div>
